<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS REDFOX</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div><div class="brand">NEXUS</div><div class="sub">REDFOX 0.2.0</div></div><button id="scan">Run scan</button></header><section class="hero"><div><h1>Codebase intelligence without the cloud.</h1><p>Local graph, deterministic security, SBOM, impact analysis and optional local AI.</p></div><div id="score" class="score">Ready</div></section><div id="cards" class="cards"></div><section class="panel"><div class="panelHead"><h2>Findings</h2><input id="q" placeholder="Filter findings"></div><div class="tableWrap"><table><thead><tr><th>Severity</th><th>Rule</th><th>Title</th><th>Path</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="grid2"><div class="panel"><h2>Architecture</h2><pre id="graph">Loading</pre></div><div class="panel"><h2>Search</h2><div class="search"><input id="search" placeholder="Symbol or path"><button id="go">Search</button></div><pre id="results"></pre></div></section></main><script src="/app.js"></script></body></html>
