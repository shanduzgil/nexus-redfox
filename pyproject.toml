[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-redfox"
version = "0.2.0"
description = "Local-first codebase intelligence, security scanning, impact analysis and MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Shanduzgil"}]
license = {file="LICENSE"}
keywords = ["code-intelligence","security","mcp","local-ai","developer-tools","sbom"]
classifiers = ["Programming Language :: Python :: 3","Programming Language :: Python :: 3 :: Only","Operating System :: OS Independent"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
"nexus" = ["data/*.json"]
